name: Python Test Framework CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-framework:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated testing framework
        run: python main.py --verbose --no-color --output-dir reports

      - name: Upload generated reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-reports
          path: |
            reports/
            results.txt
